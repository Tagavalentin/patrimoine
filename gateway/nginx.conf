# ============================================================
# API Gateway — Patrimoine de l'État
#
# Point d'entrée unique de l'API. Route par préfixe :
#   /api/auth/*         -> auth-service       (/api/*)
#   /api/assets/*       -> asset-service      (/api/*)
#   /api/maintenance/*  -> maintenance-service(/api/*)
#   /api/inventory/*    -> inventory-service  (/api/*)
#   /api/reports/*      -> reporting-service  (/api/*)
#
# Le préfixe de routage est retiré avant de transmettre au service
# (proxy_pass avec partie URI). Le token JWT est propagé tel quel
# dans l'en-tête Authorization.
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---------- Logs JSON (même format que les services) ----------
    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"referer":"$http_referer","agent":"$http_user_agent",'
        '"request_id":"$request_id","upstream":"$upstream_addr",'
        '"request_time":$request_time,"gateway":"patrimoine"}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;               # ne pas exposer la version nginx
    client_max_body_size 20m;        # pièces jointes futures

    # ---------- Rate limiting ----------
    # 30 req/s par IP sur l'API, 5 req/s sur l'authentification
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;

    # ---------- Upstreams : nginx interne de chaque service ----------
    upstream auth_backend {
        server auth-service-nginx:80;
    }
    upstream asset_backend {
        server asset-service-nginx:80;
    }
    upstream maintenance_backend {
        server maintenance-service-nginx:80;
    }
    upstream inventory_backend {
        server inventory-service-nginx:80;
    }
    upstream reporting_backend {
        server reporting-service-nginx:80;
    }

    server {
        listen 80;
        server_name _;

        # ---------- En-têtes de sécurité (toutes réponses) ----------
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ---------- CORS (le frontend appelle la gateway en cross-origin) ----------
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
        add_header Access-Control-Max-Age 86400 always;

        # ---------- Santé de la gateway ----------
        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"gateway","timestamp":"$time_iso8601"}';
        }

        # ---------- Racine : description de la gateway ----------
        location = / {
            default_type application/json;
            return 200 '{"service":"patrimoine-api-gateway","endpoints":{"auth":"/api/auth","assets":"/api/assets","maintenance":"/api/maintenance","inventory":"/api/inventory","reports":"/api/reports"}}';
        }

        # ---------- Auth (rate limiting renforcé) ----------
        location /api/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            if ($request_method = OPTIONS) { return 204; }

            proxy_pass http://auth_backend/api/;
            include /etc/nginx/proxy_params_common.conf;
        }

        # ---------- Assets ----------
        location /api/assets/ {
            limit_req zone=api_limit burst=50 nodelay;
            if ($request_method = OPTIONS) { return 204; }

            proxy_pass http://asset_backend/api/;
            include /etc/nginx/proxy_params_common.conf;
        }

        # ---------- Maintenance ----------
        location /api/maintenance/ {
            limit_req zone=api_limit burst=50 nodelay;
            if ($request_method = OPTIONS) { return 204; }

            proxy_pass http://maintenance_backend/api/;
            include /etc/nginx/proxy_params_common.conf;
        }

        # ---------- Inventory ----------
        location /api/inventory/ {
            limit_req zone=api_limit burst=50 nodelay;
            if ($request_method = OPTIONS) { return 204; }

            proxy_pass http://inventory_backend/api/;
            include /etc/nginx/proxy_params_common.conf;
        }

        # ---------- Reports ----------
        location /api/reports/ {
            limit_req zone=api_limit burst=50 nodelay;
            if ($request_method = OPTIONS) { return 204; }

            proxy_pass http://reporting_backend/api/;
            include /etc/nginx/proxy_params_common.conf;
        }

        # ---------- Tout le reste : 404 JSON ----------
        location / {
            default_type application/json;
            return 404 '{"error":"not_found","message":"Route inconnue. Voir / pour la liste des endpoints."}';
        }
    }
}
