# Paramètres proxy communs à toutes les routes /api/*
# (fichier inclus par chaque location de la gateway)

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;

# Timeouts : une API lente ne doit pas bloquer la gateway indéfiniment
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

# Ne pas réessayer sur un autre upstream (un seul conteneur par service)
proxy_next_upstream off;

# Gestion des erreurs upstream : réponse JSON plutôt que page nginx
proxy_intercept_errors off;
